<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Darkvest</title>
<meta name="theme-color" content="#0D1220">
<link rel="manifest" href="darkvest.webmanifest">
<link rel="icon" href="darkvest-180.png">
<link rel="apple-touch-icon" href="darkvest-180.png">
<script src="qrcode.js"></script>
<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;src:url(fontes/bricolage.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-display:swap;font-weight:200 800;src:url(fontes/bricolage-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-display:swap;font-weight:400;src:url(fontes/plex-mono-400.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-display:swap;font-weight:500;src:url(fontes/plex-mono-500.woff2) format('woff2')}
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F4F6FB; --ink:#151B2C; --ink-2:#5D6880; --line:#E1E5EF;
  --brass:#5B4BD6; --brass-ink:#FFFFFF; --brass-soft:#ECE9FD; --ok:#0F9F6E; --mid:#B7791F; --warn:#DC4C4C; --warn-soft:#FDE8E8;
  --inc:#0F9F6E; --exp:#DC4C4C; --inv:#C27C0E; --sky:#0284C7;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --surface:#141B2D; --surface-2:#1B2438; --ink:#E7EBF3; --ink-2:#97A2B8; --line:#26304A;
    --brass:#8B7CF6; --brass-ink:#FFFFFF; --brass-soft:#2A2550; --ok:#34D399; --mid:#FBBF24; --warn:#F87171; --warn-soft:#3B1E26;
    --inc:#34D399; --exp:#F87171; --inv:#FBBF24; --sky:#38BDF8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#141B2D; --surface-2:#1B2438; --ink:#E7EBF3; --ink-2:#97A2B8; --line:#26304A;
  --brass:#8B7CF6; --brass-ink:#FFFFFF; --brass-soft:#2A2550; --ok:#34D399; --mid:#FBBF24; --warn:#F87171; --warn-soft:#3B1E26;
  --inc:#34D399; --exp:#F87171; --inv:#FBBF24; --sky:#38BDF8;
  color-scheme:dark;
}
:root{--pd-b:"44562d50524f50524945544152494f2d303031";box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{min-height:100%}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
.muted{color:var(--ink-2)} .small{font-size:14px}
h1,h2,h3{line-height:1.2;margin:0 0 8px}
h2{font-size:26px;font-weight:650;letter-spacing:-.01em}
h3{font-size:19px;font-weight:620}
p{margin:0 0 12px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px}
textarea{resize:vertical}
label{display:block;font-weight:520;font-size:15px;margin:0 0 6px}
.field{margin-bottom:14px}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:15px;font-weight:520;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%;padding:12px}
.icon{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--ink-2);display:inline-grid;place-items:center}
.icon:hover{color:var(--ink);background:var(--surface-2)}
.icon svg{width:18px;height:18px}
.err{color:var(--warn);min-height:1.5em;font-size:15px;margin:8px 0}
.linkbtn{background:none;border:0;padding:0;color:var(--brass);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* Entrada */
.gate{min-height:100%;display:grid;place-items:center;padding:32px 20px}
.gate-card{width:min(100%,380px);text-align:center}
.gate-card.left{text-align:left;width:min(100%,440px)}
.brand{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:14px 0 6px}
.lead{color:var(--ink-2);margin-bottom:24px}
.step{color:var(--ink-2);font-size:14px;margin-bottom:4px}
.backlink{display:inline-flex;align-items:center;gap:2px;margin:0 0 14px -4px;padding:6px 4px;text-decoration:none;font-size:15px}
.dial{display:block;margin:0 auto}
.d-rim{fill:var(--surface-2);stroke:var(--brass);stroke-width:5}
.d-ticks line{stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round}
.d-hub{fill:var(--brass)}
.d-pointer{stroke:var(--brass);stroke-width:4.5;stroke-linecap:round}
.d-shackle{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.d-face{transform-origin:50px 64px;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.dots{display:flex;gap:10px;justify-content:center;margin:18px 0 6px;min-height:14px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink-2)}
.dot.on{background:var(--brass);border-color:var(--brass)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:18px}
.key{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:26px;font-weight:560;cursor:pointer;color:var(--ink)}
.key:hover{border-color:var(--brass)}
.key:active{background:var(--brass-soft)}
.key.small{font-size:15px;font-weight:520}
.key.ok{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-size:16px}
.key[disabled]{opacity:.35;cursor:not-allowed}
.status{min-height:1.5em;color:var(--ink-2);font-size:15px}
.lockmsg{color:var(--warn);font-size:15px;min-height:1.5em}
.totp-in{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:.3em;text-align:center;padding:12px}
.qr{background:#fff;padding:12px;border-radius:10px;width:fit-content;margin:8px 0 14px}
.qr img,.qr canvas{display:block}
.secret{font-size:16px;word-break:break-all;background:var(--surface-2);padding:10px 12px;border-radius:8px;margin-bottom:8px}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;padding:14px;background:var(--surface-2);border-radius:10px;font-size:17px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:450;margin:12px 0}
.check input{width:auto;margin-top:5px;accent-color:var(--brass)}
details.restore{margin-top:20px;text-align:left}
details summary{cursor:pointer;color:var(--ink-2)}
details.restore textarea{margin:10px 0}

/* App */
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:64px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.02em}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:540;font-size:15px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface)}
.lockbox{margin-left:auto;display:flex;align-items:center;gap:12px}
main.wrap{padding-top:24px;padding-bottom:48px}
.bar{display:flex;gap:10px;margin-bottom:14px}
.bar input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.chip b{font-weight:650;color:var(--ink);margin-left:4px}
.chip.has b{color:var(--warn)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,.9fr) auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.site{font-weight:620}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cell{display:flex;align-items:center;gap:2px;min-width:0}
.pw{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-right:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.acts{display:flex;gap:8px}
.empty{padding:40px 24px;text-align:center}
.empty p{max-width:46ch;margin:0 auto 16px;color:var(--ink-2)}

.gen{max-width:640px}
.gen-out{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.big{font-size:22px;word-break:break-all;margin:0 0 16px;line-height:1.45}
.gen-btns{display:flex;gap:10px}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:18px 0 6px;border:1px solid var(--line)}
.fill{display:block;height:100%;transition:width .2s}
.fill.warn{background:var(--warn)} .fill.mid{background:var(--mid)} .fill.ok{background:var(--ok)}
.opts{margin:22px 0}
.range{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.range input{flex:1 1 220px;padding:0;accent-color:var(--brass);background:none;border:0}

.settings{display:grid;gap:0;max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.set{padding:20px 22px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set p{color:var(--ink-2);max-width:62ch}
.set select{width:auto;min-width:140px}
.set .btn+.btn{margin-left:8px}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(8,12,16,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(100%,540px);max-height:calc(100% - 32px);overflow:auto;padding:24px;border:1px solid var(--line)}
.modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.grow{flex:1}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.steps{padding:0;margin:16px 0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--brass)}
.steps li p{margin:4px 0 0}
.newpw{background:var(--surface-2);padding:8px 10px;border-radius:6px;word-break:break-all;font-size:15px}
.stack{display:flex;flex-direction:column;gap:6px}
.hist{margin-top:12px}
.hist ul{padding:0;list-style:none;margin:8px 0 0}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist li span:first-child{word-break:break-all}
.howto{padding-left:18px!important;list-style:disc!important}
.howto li{display:list-item;border:0;font-size:14px;padding:4px 0}
.imp-list{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:2px 14px;margin:8px 0 12px}
.imp-list .check{margin:10px 0}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;transition:.2s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.warn{background:var(--warn);color:#fff}

.sgate{display:grid;place-items:center;padding:16px 0}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
.sbrand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sbrand b{display:block;font-size:17px;font-weight:680;letter-spacing:-.01em;line-height:1.2}
.sbrand span{display:block;font-size:13px;color:var(--ink-2);line-height:1.25}
.snav{flex:1;overflow:auto;padding:14px 10px}
.sgroup{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.sitem{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:15px;font-weight:500;text-align:left}
.sitem svg{width:18px;height:18px;flex:none;color:var(--ink-2)}
.sitem:hover{background:var(--surface-2)}
.sitem[aria-current="page"]{background:var(--brass-soft);font-weight:620}
.sitem[aria-current="page"] svg{color:var(--brass)}
.sfoot{border-top:1px solid var(--line);padding:8px 10px}
.mainc{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:6px;height:60px;padding:0 24px;border-bottom:1px solid var(--line)}
.topbar .lt{margin-right:auto}
.ibtn{position:relative;border:0;background:none;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;font-weight:650;display:grid;place-items:center;line-height:1}
.pwrap{position:relative;margin-left:6px}
.pbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 8px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink)}
.pbtn:hover{background:var(--surface)}
.pbtn>svg{width:16px;height:16px;color:var(--ink-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brass-soft);color:var(--brass);display:grid;place-items:center;font-weight:650;font-size:14px;flex:none}
.pname{display:block;font-size:14px;font-weight:600;line-height:1.25}
.psub{display:block;font-size:12px;color:var(--ink-2);line-height:1.25}
.pmenu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:210px;box-shadow:0 10px 28px rgba(0,0,0,.2);z-index:20}
.pmenu .sitem{font-size:14px}
.content{padding:32px 40px 56px;max-width:1180px;width:100%}
.phead h1{font-size:32px;font-weight:650;letter-spacing:-.02em;margin:0 0 14px;line-height:1.15}
.phead.notabs{margin-bottom:24px}
.subtabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow-x:auto}
.subtab{border:0;background:none;padding:6px 0 10px;cursor:pointer;color:var(--ink-2);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--brass);border-bottom-color:var(--brass);font-weight:560}
.rsec{margin-bottom:38px}
.rsec h2{font-size:21px;font-weight:640;margin:0 0 14px}
.rgrid{display:grid;gap:24px}
.rgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rgrid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rcard{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;padding:22px 22px 18px}
.rnum{font-size:46px;font-weight:650;line-height:1;margin:0 0 14px;letter-spacing:-.02em}
.rnum.warn{color:var(--warn)}.rnum.info{color:var(--brass)}.rnum.ok{color:var(--ok)}.rnum.none{color:var(--ink-2)}
.rnum small{font-size:22px;font-weight:600;margin-left:4px}
.rtitle{font-size:19px;font-weight:620;line-height:1.28;margin:0 0 8px}
.rtitle em{font-style:normal;color:var(--warn)}
.rdesc{font-size:14px;color:var(--ink-2);margin:0 0 18px;flex:1}
.rfoot{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rlink{border:0;background:none;padding:0;cursor:pointer;color:var(--brass);font-size:15px;font-weight:540;display:inline-flex;align-items:center;gap:6px}
.rlink svg{width:16px;height:16px}
.rlink:hover{text-decoration:underline;text-underline-offset:3px}
.rart{width:104px;flex:none;background:var(--warn-soft);display:grid;place-items:center;color:var(--warn)}
.rart svg{width:50px;height:50px}
.soon{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.attn .row{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto}
.langpick{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:10px}
.gate-card.left .langpick{justify-content:flex-start}
.langpick select{width:auto;padding:6px 10px;font-size:14px}
body.veiled #app,body.veiled #modal{filter:blur(22px);pointer-events:none;user-select:none}
#veil{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 55%,transparent);border:0;width:100%;cursor:pointer;color:var(--ink);font:inherit}
body.veiled #veil{display:grid}
#veil span{display:block;margin-top:12px;font-weight:600}
#veil small{display:block;color:var(--ink-2);margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tag.crit{background:var(--brass-soft);color:var(--brass);font-weight:600}
.tag.prot{display:inline-flex;align-items:center;gap:4px}
.tag.prot svg{width:12px;height:12px}
@media (max-width:620px){.grid3{grid-template-columns:1fr}}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.mid{width:56px;height:56px;font-size:20px}
.avatar.big{width:88px;height:88px;font-size:32px}
.pfpick{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.pfpick .btns{display:flex;flex-direction:column;gap:8px}
.ialert-bg{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.42);animation:ialfade .2s ease-out}
.ialert{width:min(290px,calc(100% - 48px));border-radius:16px;overflow:hidden;text-align:center;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 18px 50px rgba(0,0,0,.35);animation:ialpop .28s cubic-bezier(.2,1.3,.4,1)}
.ialert .dial{margin:18px auto 0}

/* ---------- cifra ---------- */
async function deriveKey(pin,salt,iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,salt,data){const iv=rand(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(data)));return {v:1,iter:ITER,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)}}
async function unseal(key,blob){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(blob.iv)},key,fromB64(blob.ct));return JSON.parse(dec.decode(pt))}
function readBlob(){try{const s=localStorage.getItem(STORE);return s?JSON.parse(s):null}catch(e){return null}}
let chain=Promise.resolve();
function save(){const k=S.key,sa=S.salt,d=S.data,tgt=S.decoy?DURESS:STORE;chain=chain.then(async()=>{if(!k)return;const b=await seal(k,sa,d);try{localStorage.setItem(tgt,JSON.stringify(b))}catch(e){toast('Não foi possível gravar neste browser.','warn')}}).catch(()=>toast('Erro ao cifrar os dados.','warn'));return chain}

/* ---------- TOTP ---------- */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(u){let bits=0,val=0,out='';for(const b of u){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(s){s=s.toUpperCase().replace(/[^A-Z2-7]/g,'');let bits=0,val=0;const out=[];for(const c of s){val=(val<<5)|B32.indexOf(c);bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
async function hotp(secret,counter){
  const k=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const buf=new ArrayBuffer(8);const dv=new DataView(buf);dv.setUint32(0,Math.floor(counter/4294967296));dv.setUint32(4,counter>>>0);
  const h=new Uint8Array(await crypto.subtle.sign('HMAC',k,buf));const o=h[19]&15;
  const n=((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3];return String(n%1000000).padStart(6,'0');
}
async function checkTotp(secret,code,lastStep){const step=Math.floor(Date.now()/30000);for(const d of [0,-1,1]){const s=step+d;if(lastStep&&s<=lastStep)continue;if(await hotp(secret,s)===code)return s}return null}
function otpUri(secret){return `otpauth://totp/Darkvest:pessoal?secret=${secret}&issuer=Darkvest&algorithm=SHA1&digits=6&period=30`}
function drawQR(el,text){if(!el)return;el.innerHTML='';if(window.qrcode){const q=qrcode(0,'M');q.addData(text);q.make();el.innerHTML=q.createSvgTag(5,2)}else{el.style.background='none';el.style.padding='0';el.innerHTML='<p class="muted small">O código QR não carregou. Usa a chave abaixo.</p>'}}
const groups=s=>s.match(/.{1,4}/g).join(' ');

/* ---------- códigos de recuperação ---------- */
const RC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function newCodes(){return Array.from({length:8},()=>{let c='';for(let i=0;i<8;i++)c+=RC[randInt(RC.length)];return c.slice(0,4)+'-'+c.slice(4)})}
const normRC=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function sha(s){const h=await crypto.subtle.digest('SHA-256',enc.encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function codesHtml(c){return `<div class="codes mono">${c.map(x=>`<span>${x}</span>`).join('')}</div>`}

/* ---------- tentativas falhadas ---------- */
const FAIL_WINDOW=10*60000,FAIL_MAX=5;
function getFails(){let f;try{f=JSON.parse(localStorage.getItem(FAILS))}catch(e){}f=f||{};const now=Date.now();
  f.t=(Array.isArray(f.t)?f.t:[]).filter(x=>now-x<FAIL_WINDOW);f.lockouts=(Array.isArray(f.lockouts)?f.lockouts:[]).filter(x=>now-x<86400000);f.until=f.until||0;f.n=f.t.length;return f}
function setFails(f){try{localStorage.setItem(FAILS,JSON.stringify(f))}catch(e){}}
function fmtDur(ms){const s=Math.round(ms/1000);return s<60?`${s} segundos`:s<3600?`${Math.round(s/60)} ${Math.round(s/60)===1?'minuto':'minutos'}`:'1 hora'}
function registerFail(){const f=getFails();const now=Date.now();f.t.push(now);f.n=f.t.length;
  if(f.n>=FAIL_MAX){f.lockouts.push(now);const dur=Math.min(3600000,30000*2**(f.lockouts.length-1));f.until=now+dur;f.t=[];f.streak=(f.streak||0)+1;
    addPending({text:`Entrada bloqueada durante ${fmtDur(dur)}: ${FAIL_MAX} tentativas falhadas em menos de 10 minutos`,fail:true});
    const sd=sdDevice();if(sd&&f.streak>=sd){selfDestruct(f.streak);return {n:0,until:0,t:[]}}}
  setFails(f);return f}
const isLocked=()=>getFails().until>Date.now();

/* ---------- gerador ---------- */
function generate(o){
  const amb=/[Il1O0o]/g;let L='abcdefghijklmnopqrstuvwxyz',U='ABCDEFGHIJKLMNOPQRSTUVWXYZ',D='0123456789';const Y='!@#$%^&*()-_=+[]{};:,.?/~';
  if(o.noAmb){L=L.replace(amb,'');U=U.replace(amb,'');D=D.replace(amb,'')}
  const sets=[];if(o.lower)sets.push(L);if(o.upper)sets.push(U);if(o.digits)sets.push(D);if(o.symbols)sets.push(Y);if(!sets.length)sets.push(L);
  const all=sets.join('');let p='';
  for(let t=0;t<200;t++){p='';for(let i=0;i<o.len;i++)p+=all[randInt(all.length)];if(o.len<sets.length||sets.every(s=>[...p].some(c=>s.includes(c))))break}
  return p;
}
function bits(p){if(!p)return 0;let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/[0-9]/.test(p))pool+=10;if(/[^a-zA-Z0-9]/.test(p))pool+=32;return Math.round(p.length*Math.log2(pool||1))}
function strength(b){if(b<60)return ['Fraca',.2,'warn'];if(b<80)return ['Razoável',.5,'mid'];if(b<110)return ['Forte',.78,'ok'];return ['Muito forte',1,'ok']}

async function copy(text,label,secret=true){
  let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove()}
  if(!ok){toast('Não foi possível copiar. Seleciona o texto manualmente.','warn');return}
  toast((label||'Copiado')+(secret?'. A área de transferência é limpa em 20 s.':'.'));
  if(secret){clearTimeout(clipT);clipT=setTimeout(async()=>{try{await navigator.clipboard.writeText('')}catch(e){}},20000)}
}

function analyse(){const c={};for(const e of S.data.entries)c[e.password]=(c[e.password]||0)+1;
  return S.data.entries.map(e=>{const age=Math.max(0,Math.floor((Date.now()-e.changedAt)/86400000));const days=effDays(e);return {e,age,days,imp:effImp(e),cat:effCat(e),old:!!e.unknownDate||age>=days,dup:c[e.password]>1,weak:bits(e.password)<60,exposed:!!(e.breach&&e.breach.n>0)}})}

  const n={todas:rows.length,mudar:rows.filter(r=>r.old).length,repetidas:rows.filter(r=>r.dup).length,fracas:rows.filter(r=>r.weak).length,criticas:rows.filter(r=>r.imp==='critica').length,expostas:rows.filter(r=>r.exposed).length};
  const lab={todas:'Todas',mudar:'Para mudar',repetidas:'Repetidas',fracas:'Fracas',criticas:'Críticas',expostas:'Expostas'};

<div style="min-width:0"><div class="site trunc">${esc(e.site)}</div><div class="muted small trunc">${esc([e.url?host(e.url):'',CATG[effCat(e)].l].filter(Boolean).join(', '))}</div></div>
<div class="cell">${e.username?`<span class="trunc">${esc(e.username)}</span><button class="icon" data-act="copyUser" aria-label="Copiar utilizador" title="Copiar utilizador">${icCopy}</button>`:'<span class="muted small">Sem utilizador</span>'}</div>

return `<section class="settings">

function render(){const v={welcome:viewWelcome,'setup-pin':viewSetupPin,'setup-totp':viewSetupTotp,'setup-recovery':viewSetupRecovery,'unlock-pin':viewUnlockPin,'unlock-totp':viewUnlockTotp,app:viewApp}[S.screen];
  $('#app').innerHTML=v();
  if(S.screen==='setup-totp')drawQR($('#qr'),otpUri(S.setup.secret));
  if(S.screen==='setup-pin')$('#pin1').focus();
  if(S.screen==='unlock-totp')$('#totp').focus();
  if(S.screen==='unlock-pin'||S.screen==='unlock-totp')tickLock();
  if(S.screen==='app'){if(S.view==='contas')renderList();if(S.view==='gerador')updateGen();if(S.view==='logs'&&S.lsub!=='ligacoes')renderLogs();if(S.view==='autenticador')tickAuth();if(S.view==='definicoes'&&$('#sg-code'))$('#sg-code').focus();tickTimer()}
}
function openModal(html){closeModal();const d=document.createElement('div');d.className='backdrop';d.id='modal';d.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  d.addEventListener('mousedown',e=>{if(e.target===d)closeModal()});document.body.appendChild(d);const f=d.querySelector('input:not([type=checkbox]),select,textarea');(f||d.querySelector('button'))?.focus()}
function closeModal(){$('#modal')?.remove();S.rot=null}

/* ---------- desbloqueio ---------- */
function updateDots(){const d=$('#dots');if(d)d.innerHTML=dotsHtml();const f=document.querySelector('.gate .d-face');if(f)f.style.transform=`rotate(${S.dialRot}deg)`}
function pressKey(k){if(isLocked())return;
  if(k==='del'){if(S.pinBuf){S.pinBuf=S.pinBuf.slice(0,-1);S.dialRot-=36}}
  else if(k==='ok'){submitPin();return}
  else if(S.pinBuf.length<12){S.pinBuf+=k;S.dialRot+=36}
  setErr('');updateDots()}
let verifying=false;
async function submitPin(){if(verifying||isLocked())return;const pin=S.pinBuf;
  if(pin.length<6){setErr('O PIN tem pelo menos 6 dígitos.');return}
  verifying=true;setErr('');$('#pinStatus').textContent='A verificar…';
  const blob=readBlob();
  try{const salt=fromB64(blob.salt);const dz=readDuress();
    const [key,dkey]=await Promise.all([deriveKey(pin,salt,blob.iter||ITER),dz?deriveKey(pin,fromB64(dz.salt),dz.iter||ITER):Promise.resolve(null)]);
    let data=null,decoy=false,uk=key,us=salt;try{data=await unseal(key,blob)}catch(e){}
    if(!data&&dz){try{data=await unseal(dkey,dz);decoy=true;uk=dkey;us=fromB64(dz.salt)}catch(e){}}
    if(!data)throw new Error('pin');
    S.pending={key:uk,salt:us,data,decoy};S.pinBuf='';S.useRecovery=false;S.screen='unlock-totp';verifying=false;render()}
  catch(e){verifying=false;addPending({text:'Tentativa falhada: PIN incorreto',fail:true});const f=registerFail();S.pinBuf='';S.dialRot=0;updateDots();$('#pinStatus').textContent='';
    const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    setErr(f.until>Date.now()?'':`PIN incorreto.${f.n>=3?` Mais ${FAIL_MAX-f.n} ${FAIL_MAX-f.n===1?'erro':'erros'} nos próximos minutos bloqueia a entrada temporariamente.`:''}`);tickLock()}}
async function submitTotp(){if(verifying||isLocked())return;const inp=$('#totp');const v=inp.value.trim();const P=S.pending;if(!P)return;
  verifying=true;
  try{
    if(S.useRecovery){const h=await sha(normRC(v));const i=P.data.recovery.indexOf(h);
      if(i<0){totpFail('Código de recuperação inválido ou já usado.');return}
      P.data.recovery.splice(i,1);enterVault(`Código de recuperação usado. Restam ${P.data.recovery.length}. Considera ligar uma nova app em Definições.`)}
    else{if(!/^\d{6}$/.test(v)){verifying=false;setErr('Introduz os 6 dígitos.');return}
      const step=await checkTotp(P.data.totp.secret,v,P.data.totp.lastStep);
      if(step===null){totpFail('Código incorreto ou expirado. Confirma que a hora do telemóvel está certa.');return}
      P.data.totp.lastStep=step;enterVault()}
  }finally{verifying=false}}
function totpFail(m){addPending({text:S.useRecovery?'Tentativa falhada: PIN correto, mas código de recuperação inválido':'Tentativa falhada: PIN correto, mas código da app autenticadora errado',fail:true});const f=registerFail();const i=$('#totp');i.value='';i.focus();setErr(f.until>Date.now()?'':m);tickLock();verifying=false}
function enterVault(msg){const P=S.pending;S.key=P.key;S.salt=P.salt;S.data=P.data;S.decoy=!!P.decoy;S.pending=null;S.useRecovery=false;setFails({n:0,until:0});
  ensureDefaults();const known=Object.keys(S.data.devices);const newDev=known.length>0&&!known.includes(devLocal().id);const fails=flushPending();{const lim=Date.now()-30*86400000;const old=S.data.trash.filter(x=>x.deletedAt<lim).length;if(old){S.data.trash=S.data.trash.filter(x=>x.deletedAt>=lim);logEv('contas',`${old} ${old===1?'item removido':'itens removidos'} de vez do lixo (mais de 30 dias)`)}}logEv('acesso',msg?'Cofre desbloqueado com PIN e código de recuperação':'Cofre desbloqueado com PIN e app autenticadora');
  if(newDev)logEv('seguranca',`Cofre aberto num dispositivo novo: ${devLabel(deviceInfo())}`,true);
  S.lastActivity=Date.now();S.screen='app';S.view='contas';S.filter='todas';S.query='';save();render();ensureFiller();if(!S.decoy)importDecoyLogs();
  if(newDev)toast('O cofre foi aberto num dispositivo novo. Se não foste tu, muda o PIN já.','warn');else if(fails)toast(`Houve ${fails} ${fails===1?'tentativa falhada':'tentativas falhadas'} de entrada desde a última vez. Vê os detalhes em Logs.`,'warn');else if(msg)toast(msg)}
function ensureDefaults(){const d={autoLockMin:5,rotationDays:30,gen:{len:20,lower:true,upper:true,digits:true,symbols:true,noAmb:true}};
  S.data.settings=Object.assign({},d,S.data.settings||{});S.data.settings.gen=Object.assign({},d.gen,S.data.settings.gen||{});S.data.entries=S.data.entries||[];S.data.recovery=S.data.recovery||[];S.data.logs=S.data.logs||[];S.data.devices=S.data.devices||{};S.data.notes=S.data.notes||[];S.data.cards=S.data.cards||[];S.data.ids=S.data.ids||[];S.data.trash=S.data.trash||[];S.data.wm=S.data.wm||BUILD_MARK}
function lock(reason){if(S.key&&S.data){logEv('acesso',reason==='inatividade'?'Cofre bloqueado por inatividade':reason==='2fa'?'Cofre bloqueado após 5 códigos 2FA errados nas definições':'Cofre bloqueado manualmente',reason==='2fa');save()}
  setVeil(false);S.decoy=false;closeModal();S.settingsOkUntil=0;S.sgFailT=[];S.sgRecovery=false;for(const k in unlockedUntil)delete unlockedUntil[k];S.pg=null;S.key=null;S.salt=null;S.data=null;S.pending=null;S.shown.clear();S.genPw=null;S.pinBuf='';S.dialRot=0;S.screen=readBlob()?'unlock-pin':'welcome';render()}
function tickLock(){const el=$('#lockmsg');if(!el)return;const f=getFails();const ms=f.until-Date.now();
  if(ms>0){const s=Math.ceil(ms/1000);el.textContent=`Demasiadas tentativas. Tenta de novo em ${s>=60?Math.floor(s/60)+' min '+(s%60)+' s':s+' s'}.`;document.querySelectorAll('.key,.gate .btn.primary').forEach(b=>b.disabled=true)}
  else if(el.textContent){el.textContent='';document.querySelectorAll('.key,.gate .btn.primary').forEach(b=>b.disabled=false)}}
function tickTimer(){if(S.screen!=='app')return;const ms=S.data.settings.autoLockMin*60000-(Date.now()-S.lastActivity);
  if(ms<=0){lock('inatividade');toast('Cofre bloqueado por inatividade.');return}

function parseCSV(t){t=t.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function mapImport(rows){if(rows.length<1)return null;const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...ns)=>{for(const n of ns){const i=h.indexOf(n);if(i>=0)return i}return -1};
  const ci={name:col('name','title'),url:col('url','login_uri','website','origin'),user:col('username','login_username','user','email'),pass:col('password','login_password'),note:col('note','notes','extra'),changed:col('timepasswordchanged')};
  if(ci.pass<0)return null;const out=[];
  for(const r of rows.slice(1)){const g=i=>i>=0?(r[i]||'').trim():'';const password=r[ci.pass]||'';if(!password)continue;
    let url='';try{const u=g(ci.url);if(/^https?:\/\//i.test(u))url=new URL(u).origin}catch(e){}
    const site=g(ci.name)||(url?host(url).replace(/^www\./,''):'')||g(ci.url)||'Sem nome';const ch=+g(ci.changed);
    out.push({site,url,username:g(ci.user),password,notes:g(ci.note),changedAt:ch>1e11&&ch<=Date.now()?ch:null})}
  return out}

function fillerBlob(){return {v:1,iter:ITER,salt:toB64(rand(16)),iv:toB64(rand(12)),ct:toB64(rand(1800+randInt(2400)))}}

async function importDecoyLogs(){if(S.decoy||!S.data||!S.data.duress)return;const x=await decoyKey();if(!x||!S.data||S.decoy)return;const since=S.data.duress.lastSync||0;
  const nl=(x.d.logs||[]).filter(l=>l.ts>since);if(!nl.length)return;
  for(const l of nl){const d=(x.d.devices||{})[l.dev];if(d)S.data.devices[l.dev]=Object.assign({},S.data.devices[l.dev]||{},d);
    S.data.logs.push({id:uid(),ts:l.ts,cat:'seguranca',text:/^Cofre desbloqueado/.test(l.text)?'PIN de coação usado: o cofre falso foi aberto':`No cofre falso: ${l.text}`,dev:l.dev,warn:/^Cofre desbloqueado/.test(l.text)||l.warn})}

function avatarHtml(cls='',id=''){const p=(S.data&&S.data.profile)||{};return `<span class="avatar ${cls}"${id?` id="${id}"`:''}>${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(pfInitials(p.name))}</span>`}
function pfLoad(file){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('tipo'));if(file.size>15e6)return rej(new Error('grande'));
  const fr=new FileReader();fr.onerror=()=>rej(new Error('ler'));fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('img'));
    img.onload=()=>{try{const sz=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.imageSmoothingQuality='high';
      x.drawImage(img,(img.naturalWidth-sz)/2,(img.naturalHeight-sz)/2,sz,sz,0,0,256,256);res(c.toDataURL('image/jpeg',0.85))}catch(e){rej(e)}};img.src=fr.result};fr.readAsDataURL(file)})}

/* ---------- dispositivo ---------- */
const DEVK='darkvest.v1.dispositivo',PEND='darkvest.v1.pendentes';
function devLocal(){try{let d=JSON.parse(localStorage.getItem(DEVK)||'null');if(!d||!d.id){d={id:toB64(rand(9)).replace(/[+/=]/g,''),name:''};localStorage.setItem(DEVK,JSON.stringify(d))}return d}catch(e){return {id:'desconhecido',name:''}}}
function deviceInfo(){const ua=navigator.userAgent||'';const m=re=>{const r=ua.match(re);return r?r[1]:''};let browser='Browser desconhecido',os='Sistema desconhecido';
  if(/Edg(A|iOS)?\//.test(ua))browser='Edge '+m(/Edg(?:A|iOS)?\/(\d+)/);else if(/OPR\//.test(ua))browser='Opera '+m(/OPR\/(\d+)/);
  else if(/FxiOS\//.test(ua))browser='Firefox '+m(/FxiOS\/(\d+)/);else if(/Firefox\//.test(ua))browser='Firefox '+m(/Firefox\/(\d+)/);
  else if(/CriOS\//.test(ua))browser='Chrome '+m(/CriOS\/(\d+)/);else if(/Chrome\//.test(ua))browser='Chrome '+m(/Chrome\/(\d+)/);
  else if(/Safari\//.test(ua))browser='Safari '+m(/Version\/(\d+(?:\.\d+)?)/);
  if(/iPhone/.test(ua))os='iOS '+m(/OS (\d+(?:_\d+)?)/).replace('_','.');else if(/iPad/.test(ua))os='iPadOS '+m(/OS (\d+(?:_\d+)?)/).replace('_','.');
  else if(/Android/.test(ua))os='Android '+m(/Android ([\d.]+)/);else if(/Windows NT 10/.test(ua))os='Windows 10/11';else if(/Windows/.test(ua))os='Windows';
  else if(/Mac OS X/.test(ua))os='macOS';else if(/CrOS/.test(ua))os='ChromeOS';else if(/Linux/.test(ua))os='Linux';
  const type=/iPad|Tablet/.test(ua)?'Tablet':/Mobi|iPhone|Android/.test(ua)?'Telemóvel':'Computador';const l=devLocal();
  let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
  return {id:l.id,name:l.name||'',type,browser,os,screen:`${screen.width}×${screen.height}`,lang:navigator.language||'',tz,ua}}
const devLabel=d=>d&&d.browser?`${d.name?d.name+', ':''}${d.browser} em ${d.os}`:'Dispositivo desconhecido';
function deviceSettingsHtml(){const d=deviceInfo();return `<div class="set"><h3>Este dispositivo</h3><p>Dá um nome a este dispositivo para o reconheceres nos logs. Detetado: ${esc(d.type.toLowerCase())}, ${esc(d.browser)} em ${esc(d.os)}.</p>
<div class="inline" style="max-width:440px"><input id="devname" value="${esc(d.name)}" placeholder="Ex.: Portátil de casa" maxlength="40" aria-label="Nome deste dispositivo"><button class="btn" data-act="saveDevName">Guardar nome</button></div></div>`}

/* ---------- logs de atividade ---------- */
const CATS={todos:'Todos',acesso:'Acessos',contas:'Itens',seguranca:'Segurança',definicoes:'Definições'};
function logEv(cat,text,warn){if(!S.data)return;const d=deviceInfo();S.data.devices=S.data.devices||{};S.data.devices[d.id]=Object.assign({},d,{lastSeen:Date.now()});
  S.data.logs=S.data.logs||[];S.data.logs.push({id:uid(),ts:Date.now(),cat,text,dev:d.id,warn:!!warn});if(S.data.logs.length>1000)S.data.logs.splice(0,S.data.logs.length-1000)}
function addPending(p){try{const a=JSON.parse(localStorage.getItem(PEND)||'[]');a.push({ts:Date.now(),text:p.text,cat:p.cat||'acesso',fail:!!p.fail,dev:deviceInfo()});localStorage.setItem(PEND,JSON.stringify(a.slice(-200)))}catch(e){}}
function flushPending(){let a=[];try{a=JSON.parse(localStorage.getItem(PEND)||'[]');localStorage.removeItem(PEND)}catch(e){}let fails=0;
  for(const p of a){if(!p||!p.dev)continue;S.data.devices[p.dev.id]=Object.assign({},S.data.devices[p.dev.id]||{},p.dev);S.data.logs.push({id:uid(),ts:p.ts,cat:p.cat,text:p.text,dev:p.dev.id,warn:!!p.fail});if(p.fail&&/^Tentativa/.test(p.text))fails++}
  S.data.logs.sort((x,y)=>x.ts-y.ts);return fails}
function filteredLogs(){const q=S.lquery.trim().toLowerCase();return S.data.logs.filter(l=>(S.lfilter==='todos'||(S.lfilter==='alertas'?l.warn:l.cat===S.lfilter))&&(!q||(l.text+' '+devLabel(S.data.devices[l.dev])).toLowerCase().includes(q))).slice().reverse()}
function viewLogs(){return `<div class="bar"><input id="lq" type="search" placeholder="Procurar nos logs" aria-label="Procurar nos logs" value="${esc(S.lquery)}" data-in="lquery"><button class="btn" data-act="copyLogs">Copiar logs</button></div>
<div class="chips" id="lchips"></div><div class="list" id="logs"></div>`}
function dayLabel(ts){const d=new Date(ts),t=new Date();const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(t.getFullYear(),t.getMonth(),t.getDate());const diff=Math.round((b-a)/86400000);
  return diff===0?'Hoje':diff===1?'Ontem':d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:a.getFullYear()===b.getFullYear()?undefined:'numeric'})}
function renderLogs(){const all=S.data.logs;const n={todos:all.length};for(const k of ['acesso','contas','seguranca','definicoes'])n[k]=all.filter(l=>l.cat===k).length;
  const warnN=all.filter(l=>l.warn).length;
  $('#lchips').innerHTML=Object.keys(CATS).map(k=>`<button class="chip ${k==='acesso'&&warnN?'has':''}" aria-pressed="${S.lfilter===k}" data-act="lfilter" data-v="${k}">${CATS[k]}<b>${n[k]}</b></button>`).join('')+`<button class="chip ${warnN?'has':''}" aria-pressed="${S.lfilter==='alertas'}" data-act="lfilter" data-v="alertas">Alertas<b>${warnN}</b></button>`;
  const list=filteredLogs();const L=$('#logs');
  if(!all.length){L.innerHTML='<div class="empty"><p>Ainda não há atividade registada. A partir de agora, cada entrada, alteração e acesso fica aqui.</p></div>';return}
  if(!list.length){L.innerHTML='<div class="empty"><p>Nenhum registo corresponde a este filtro.</p></div>';return}
  const me=devLocal().id;let h='',day='';const show=list.slice(0,300);
  for(const l of show){const dl=dayLabel(l.ts);if(dl!==day){day=dl;h+=`<div class="day">${esc(dl.charAt(0).toUpperCase()+dl.slice(1))}</div>`}
    const d=S.data.devices[l.dev]||{};const t=new Date(l.ts);
    h+=`<details class="log"><summary><span class="ltime mono">${t.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</span><span class="tag cat ${l.warn?'warn':'cat-'+l.cat}">${l.warn?'Alerta':CATS[l.cat]||l.cat}</span><span class="ltext">${esc(l.text)}</span><span class="ldev">${esc(devLabel(d))}${l.dev===me?' (este)':''}</span></summary>
<dl class="ldet"><dt>Data e hora</dt><dd>${esc(t.toLocaleString('pt-PT'))}</dd><dt>Dispositivo</dt><dd>${esc(d.name||'Sem nome')}${l.dev===me?' (este dispositivo)':''}</dd><dt>Tipo</dt><dd>${esc(d.type||'—')}</dd>
<dt>Sistema</dt><dd>${esc(d.os||'—')}</dd><dt>Browser</dt><dd>${esc(d.browser||'—')}</dd><dt>Ecrã</dt><dd>${esc(d.screen||'—')}</dd><dt>Idioma</dt><dd>${esc(d.lang||'—')}</dd><dt>Fuso horário</dt><dd>${esc(d.tz||'—')}</dd>
<dt>Endereço IP</dt><dd>${l.ip?esc(l.ip):'<span class="muted">Disponível na versão ligada ao computador</span>'}</dd><dt>Endereço físico (MAC)</dt><dd>${l.mac?esc(l.mac):'<span class="muted">Disponível na versão ligada ao computador</span>'}</dd>
<dt>Identificador</dt><dd class="mono">${esc(l.dev||'—')}</dd><dt>User agent</dt><dd class="mono small">${esc(d.ua||'—')}</dd></dl></details>`}
  if(list.length>show.length)h+=`<div class="lmore">A mostrar os 300 registos mais recentes de ${list.length}. Usa a pesquisa ou os filtros para encontrar os anteriores.</div>`;
  L.innerHTML=h}

const IMPS={critica:'Crítica',normal:'Normal',baixa:'Baixa'},IMPW={critica:3,normal:2,baixa:1};
const normTxt=t=>' '+String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()+' ';
function detectCat(e){const hay=normTxt((e.site||'')+' '+(e.url?host(e.url):''));for(const [k,c] of Object.entries(CATG)){for(const kw of c.k){const n=normTxt(kw).trim();if(hay.includes(' '+n+' ')||(n.length>=6&&hay.includes(n)))return k}}return 'outra'}
const effCat=e=>e.cat&&CATG[e.cat]?e.cat:detectCat(e);
const effImp=e=>e.imp&&IMPS[e.imp]?e.imp:CATG[effCat(e)].imp;
const catDays=c=>CATG[c].days||S.data.settings.rotationDays;
const effDays=e=>+e.rotDays||catDays(effCat(e));
const effProtect=e=>typeof e.protect==='boolean'?e.protect:effImp(e)==='critica';

/* ---------- itens protegidos (pedem o código 2FA) ---------- */
const unlockedUntil={};
const UNLOCK_MS=5*60000;
function isUnlocked(id){const n=Date.now();return (unlockedUntil[id]||0)>n||(unlockedUntil.__all||0)>n}
const isProt=(it,tk)=>tk==='contas'?effProtect(it):!!it.protect;
function guard(it,tk,what,after){if(!isProt(it,tk)||isUnlocked(it.id))return true;
  const title=tk==='contas'?it.site:it[ITYPES[tk].title];S.pg={id:it.id,tk,title,after};
  openModal(`<h3>Item protegido</h3><p class="muted">«${esc(title)}» está marcado como protegido. Para ${what}, introduz o código da app autenticadora. Depois disso, todos os itens protegidos ficam desbloqueados durante 5 minutos.</p>
<div class="field"><label for="pg-code">Código de 6 dígitos</label><input id="pg-code" class="totp-in" inputmode="numeric" maxlength="6" autocomplete="one-time-code" data-in="pgAuto"></div><p class="err" id="pg-err"></p>
<div class="modal-actions"><span class="grow"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="pgSubmit">Confirmar</button></div>`);return false}
let pgBusy=false;
async function pgSubmit(){if(pgBusy||!S.pg)return;const inp=$('#pg-code');const v=inp.value.trim();if(!/^\d{6}$/.test(v)){setErr('Introduz os 6 dígitos.','#pg-err');return}pgBusy=true;
  try{const step=await checkTotp(S.data.totp.secret,v,S.data.totp.lastStep);
    if(step===null){const now=Date.now();S.sgFailT=(S.sgFailT||[]).filter(x=>now-x<FAIL_WINDOW);S.sgFailT.push(now);logEv('acesso',`Código 2FA errado ao abrir um item protegido: ${S.pg.title}`,true);save();
      if(S.sgFailT.length>=FAIL_MAX){lock('2fa');toast('Demasiados códigos errados. Volta a entrar com PIN e código.','warn');return}
      inp.value='';inp.focus();setErr('Código incorreto ou já usado. Cada código só serve uma vez: espera pelo seguinte na app.','#pg-err');return}
    S.data.totp.lastStep=step;S.sgFailT=[];const pg=S.pg;S.pg=null;unlockedUntil[pg.id]=unlockedUntil.__all=Date.now()+UNLOCK_MS;logEv('acesso',`Itens protegidos desbloqueados durante 5 minutos (a partir de: ${pg.title})`);save();closeModal();toast('Itens protegidos desbloqueados durante 5 minutos.');if(pg.after)pg.after()}
  finally{pgBusy=false}}

function renderSelbar(){const b=$('#selbar');if(!b)return;if(!S.sel){b.innerHTML='';b.hidden=true;return}b.hidden=false;
  const vis=S.visIds||[];const n=S.selIds.size;const allOn=vis.length>0&&vis.every(id=>S.selIds.has(id));
  b.innerHTML=`<label class="check"><input type="checkbox" data-in="selAll" ${allOn?'checked':''}> Selecionar ${S.filter!=='todas'||S.query?'as visíveis':'todas'} (${vis.length})</label><span class="grow"></span><span class="small">${n} ${n===1?'selecionada':'selecionadas'}</span><button class="btn danger" data-act="selDelete" ${n?'':'disabled'}>Mover para o lixo</button><button class="btn" data-act="selToggle">Cancelar</button>`}
function bulkTrash(ids){const now=Date.now();const names=[];
  for(const id of ids){const e=S.data.entries.find(x=>x.id===id);if(!e)continue;S.data.trash.push({id:uid(),type:'contas',item:e,deletedAt:now});names.push(e.site)}
  S.data.entries=S.data.entries.filter(e=>!ids.includes(e.id));const n=names.length;
  logEv('contas',`${n} ${n===1?'conta movida':'contas movidas'} para o lixo: ${names.slice(0,8).join(', ')}${n>8?` e mais ${n-8}`:''}`);
  S.sel=false;S.selIds.clear();save();render();toast(`${n} ${n===1?'conta movida':'contas movidas'} para o lixo. Podes restaurá-las no Lixo durante 30 dias.`)}

function itemSave(tk,id){const T=ITYPES[tk];const v={};for(const f of T.fields){const el=$('#if-'+f.k);v[f.k]=f.t==='area'?el.value:el.value.trim()}const prot=$('#if-protect').checked,home=$('#if-home').checked;

/* ---------- autenticador 2FA ---------- */
function parseTotp(v){v=(v||'').trim();if(/^otpauth:/i.test(v)){try{const u=new URL(v);const p=u.searchParams;
    if((p.get('digits')||'6')!=='6'||(p.get('period')||'30')!=='30'||(p.get('algorithm')||'SHA1').toUpperCase()!=='SHA1')return {err:'Este código usa um formato que o Darkvest ainda não suporta (só 6 dígitos, 30 segundos e SHA-1).'};v=p.get('secret')||''}catch(e){return {err:'O endereço otpauth não é válido.'}}}
  const sec=v.toUpperCase().replace(/[\s-]/g,'').replace(/=+$/,'');if(!/^[A-Z2-7]{16,}$/.test(sec))return {err:'A chave deve ter pelo menos 16 caracteres, só com letras A a Z e algarismos 2 a 7.'};return {secret:sec}}
function ringSvg(left){const f=left/30,r=12,c=2*Math.PI*r;return `<svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="${left} segundos"><circle cx="16" cy="16" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"></circle><circle cx="16" cy="16" r="${r}" fill="none" stroke="${left<=5?'var(--warn)':'var(--brass)'}" stroke-width="3" stroke-dasharray="${(c*f).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 16 16)" stroke-linecap="round"></circle><text x="16" y="20" text-anchor="middle" font-size="10" fill="var(--ink-2)">${left}</text></svg>`}
let authBusy=false;
async function tickAuth(){if(authBusy||S.screen!=='app'||S.view!=='autenticador')return;authBusy=true;try{const now=Date.now();const step=Math.floor(now/30000);const left=30-Math.floor(now/1000)%30;
  for(const el of document.querySelectorAll('[data-code]')){const e=S.data.entries.find(x=>x.id===el.dataset.code);if(!e||!e.totp)continue;const c=await hotp(e.totp,step);el.textContent=c.slice(0,3)+' '+c.slice(3)}
  for(const el of document.querySelectorAll('[data-ring]'))el.innerHTML=ringSvg(left)}finally{authBusy=false}}
function viewAuth(){const list=S.data.entries.filter(e=>e.totp).sort((a,b)=>a.site.localeCompare(b.site,'pt'));
  return `<p class="muted note-lead">Códigos de verificação em dois passos (2FA) das tuas contas, gerados neste dispositivo. Por segurança, guarda aqui apenas os de contas menos críticas: para o email principal e o banco, mantém o 2FA numa app separada, para que as passwords e os códigos não fiquem no mesmo sítio. O código do próprio Darkvest nunca deve ficar aqui.</p>
<div class="bar" style="justify-content:flex-end"><button class="btn primary" data-act="authAdd">Adicionar código 2FA</button></div>
<div class="list">${list.length?list.map(e=>`<div class="row arow" data-id="${e.id}"><div style="min-width:0"><div class="site trunc">${esc(e.site)}</div><div class="muted small trunc">${esc(e.username||'')}</div></div><div class="acode mono" data-code="${e.id}">··· ···</div><div data-ring="${e.id}"></div><div class="acts"><button class="btn primary" data-act="authCopy">Copiar</button><button class="btn" data-act="authEdit">Editar</button></div></div>`).join('')
  :'<div class="empty"><h3>Ainda não tens códigos 2FA aqui</h3><p>Quando ativares a verificação em dois passos num site, ele mostra um código QR e uma chave de texto. Copia essa chave para aqui e escolhe a conta a que pertence.</p><button class="btn primary" data-act="authAdd">Adicionar código 2FA</button></div>'}</div>`}
function authModal(id){const e=id?S.data.entries.find(x=>x.id===id):null;if(!e&&!S.data.entries.length){toast('Adiciona primeiro a conta em Contas.','warn');return}
  openModal(`<h3>${e?`Código 2FA de ${esc(e.site)}`:'Adicionar código 2FA'}</h3>
${e?'':`<div class="field"><label for="au-acc">Conta</label><select id="au-acc">${S.data.entries.slice().sort((a,b)=>a.site.localeCompare(b.site,'pt')).map(x=>`<option value="${x.id}">${esc(x.site)}${x.username?' ('+esc(x.username)+')':''}${x.totp?', já tem 2FA':''}</option>`).join('')}</select></div>`}
<div class="field"><label for="au-key">Chave de configuração ou endereço otpauth://</label><input id="au-key" class="mono" autocomplete="off" spellcheck="false" placeholder="${e?'Cola uma chave nova para substituir':'Ex.: JBSW Y3DP EHPK 3PXP'}"></div>
<p class="muted small">No site, escolhe a opção de introduzir a chave manualmente (normalmente aparece por baixo do código QR) e cola-a aqui.</p><p class="err" id="au-err"></p>
<div class="modal-actions">${e?`<button class="btn danger" data-act="authRemove" data-id="${e.id}">Remover código 2FA</button>`:''}<span class="grow"></span><button class="btn" data-act="closeModal">Cancelar</button><button class="btn primary" data-act="authSave" data-id="${e?e.id:''}">Guardar</button></div>`)}

/* ---------- reports ---------- */
function rcard(o){return `<div class="rcard"><div class="rbody"><p class="rnum ${o.cls||'info'}">${o.num}</p><h3 class="rtitle">${o.title}</h3><p class="rdesc">${o.desc}</p>
${o.link||o.soon?`<div class="rfoot">${o.link?`<button class="rlink" data-act="${o.act}" ${o.attrs||''}>${o.link} ${ic('arrow')}</button>`:'<span></span>'}${o.soon?`<span class="soon">${o.soon}</span>`:''}</div>`:''}</div>${o.art?`<div class="rart">${ic(o.art)}</div>`:''}</div>`}
function stats(){const rows=analyse();const d30=Date.now()-30*86400000;const logs=S.data.logs;
  const lastBk=[...logs].reverse().find(l=>/^Cópia de segurança/.test(l.text));
  const emails=new Set(S.data.entries.map(e=>(e.username||'').trim().toLowerCase()).filter(u=>u.includes('@'))).size;
  const problems=rows.filter(r=>r.old||r.dup||r.weak||r.exposed).length;
  return {rows,days:S.data.settings.rotationDays,old:rows.filter(r=>r.old).length,dup:rows.filter(r=>r.dup).length,weak:rows.filter(r=>r.weak).length,
    fails:logs.filter(l=>l.warn&&l.ts>d30).length,lastBk,emails,problems,devs:new Set(logs.filter(l=>l.ts>d30).map(l=>l.dev)).size,
    score:rows.length?Math.round(100*rows.reduce((a,r)=>a+((r.old||r.dup||r.weak||r.exposed)?0:IMPW[r.imp]),0)/rows.reduce((a,r)=>a+IMPW[r.imp],0)):null,avgAge:rows.length?Math.round(rows.reduce((a,r)=>a+r.age,0)/rows.length):null}}
const pl=(n,a,b)=>n===1?a:b;
function pwnCards(st){const on=S.data.settings.pwnedCheck;const ents=S.data.entries.filter(e=>e.password);const checked=ents.filter(e=>e.breach).length;
  const expAcc=ents.filter(e=>e.breach&&e.breach.n>0);const expPw=new Set(expAcc.map(e=>e.password)).size;const last=S.data.settings.pwnedLast;
  if(!on)return rcard({num:'—',cls:'none',title:'Passwords expostas em fugas de dados',desc:'Compara as tuas passwords com a base pública e gratuita Pwned Passwords, sem nunca as enviar.',link:'Ativar nas definições',act:'goto',attrs:'data-view="definicoes"',soon:'Desligado',art:'keyx'})
    +rcard({num:'—',cls:'none',title:`Passwords verificadas, de <em>${ents.length}</em> guardadas`,desc:'A verificação só corre quando a pedes e só envia um fragmento cifrado de cada password.',link:'Como funciona',act:'breachInfo',soon:'Desligado',art:'search'});
  return rcard({num:checked?expPw:'—',cls:!checked?'none':expPw?'warn':'ok',title:`${pl(expPw,'Password exposta','Passwords expostas')} em fugas de dados, ${pl(expPw,'usada','usadas')} em <em>${expAcc.length}</em> ${pl(expAcc.length,'conta','contas')}`,desc:'Uma password que já apareceu numa fuga é das primeiras a ser experimentada por atacantes. Muda-a em todas as contas onde a usas.',link:'Ver contas',act:'goto',attrs:'data-view="contas" data-f="expostas"',art:'keyx'})
    +rcard({num:checked,cls:'info',title:`Passwords verificadas, de <em>${ents.length}</em> guardadas`,desc:last?`Última verificação: ${new Date(last).toLocaleString('pt-PT',{dateStyle:'short',timeStyle:'short'})}. Passwords novas ou mudadas ficam por verificar até correres de novo.`:'Ainda não correste nenhuma verificação.',link:'Verificar agora',act:'pwnCheck',art:'search'})}
function viewReportsAnalise(){const st=stats();const bkDays=st.lastBk?Math.floor((Date.now()-st.lastBk.ts)/86400000):null;const rc=S.data.recovery.length;
return `<section class="rsec"><h2>Verificação de passwords expostas</h2><div class="rgrid c2">
${pwnCards(st)}
</div></section>
<section class="rsec"><h2>Utilização das passwords</h2><div class="rgrid c3">
${rcard({num:st.old,cls:st.old?'warn':'ok',title:`${pl(st.old,'Conta','Contas')} com a password fora do prazo de mudança`,desc:'Cada conta tem o seu prazo conforme a categoria: 30 dias para bancos, 1 ano para lojas online. Mudar com regularidade as passwords importantes reduz o tempo em que uma password roubada serve para alguma coisa.',link:'Ver contas',act:'goto',attrs:'data-view="contas" data-f="mudar"'})}
${rcard({num:st.dup,cls:st.dup?'warn':'ok',title:`${pl(st.dup,'Conta que partilha','Contas que partilham')} a password com outra`,desc:'Passwords fracas e repetidas são a principal causa de contas comprometidas: uma fuga num site abre as outras.',link:'Ver contas',act:'goto',attrs:'data-view="contas" data-f="repetidas"'})}
${rcard({num:st.weak,cls:st.weak?'warn':'ok',title:`${pl(st.weak,'Password fraca','Passwords fracas')}`,desc:'Passwords curtas ou com poucos tipos de caracteres adivinham-se em pouco tempo. Usa o gerador para as substituir.',link:'Ver contas',act:'goto',attrs:'data-view="contas" data-f="fracas"'})}
</div></section>
<section class="rsec"><h2>Documentos e cartões</h2><div class="rgrid c3">
${(()=>{const cards=S.data.cards.filter(c=>{const d=cardExpDays(c);return d!==null&&d<=90}).length;
  const docs=S.data.ids.reduce((a,i)=>a+[i.ccExp,i.passportExp].filter(v=>{const d=docExpDays(v);return d!==null&&d<=90}).length,0);const tf=S.data.entries.filter(e=>e.totp).length;
  return rcard({num:cards,cls:cards?'warn':'ok',title:`${pl(cards,'Cartão expirado ou a expirar','Cartões expirados ou a expirar')} nos próximos 90 dias`,desc:'Pede um cartão novo a tempo e atualiza os dados nos sites onde o usas.',link:'Ver cartões',act:'goto',attrs:'data-view="cartoes"'})
   +rcard({num:docs,cls:docs?'warn':'ok',title:`${pl(docs,'Documento expirado ou a expirar','Documentos expirados ou a expirar')} nos próximos 90 dias`,desc:'Cartão de Cidadão e passaporte. A renovação pode demorar semanas, por isso convém tratar com antecedência.',link:'Ver identidades',act:'goto',attrs:'data-view="identidades"'})
   +rcard({num:tf,cls:'info',title:`${pl(tf,'Conta','Contas')} com código 2FA no Darkvest`,desc:'Práticos, mas ficam no mesmo cofre que as passwords. Para as contas mais críticas, usa uma app autenticadora separada.',link:'Ver autenticador',act:'goto',attrs:'data-view="autenticador"'})})()}
</div></section>
<section class="rsec"><h2>Segurança do cofre</h2><div class="rgrid c3">
${rcard({num:st.fails,cls:st.fails?'warn':'ok',title:`${pl(st.fails,'Alerta','Alertas')} de entrada nos últimos 30 dias`,desc:'PIN ou código 2FA errados e bloqueios por excesso de tentativas, em qualquer dispositivo.',link:'Ver alertas',act:'goto',attrs:'data-view="logs" data-f="alertas"'})}
${rcard({num:rc,cls:rc<3?'warn':'info',title:`${pl(rc,'Código','Códigos')} de recuperação por usar`,desc:'Servem para entrar se perderes o telemóvel com a app autenticadora. Gera novos quando estiverem a acabar.',link:'Abrir definições',act:'goto',attrs:'data-view="definicoes"'})}
${rcard({num:bkDays===null?'—':bkDays,cls:bkDays===null||bkDays>30?'warn':'info',title:bkDays===null?'Ainda não fizeste nenhuma cópia de segurança':`${pl(bkDays,'Dia','Dias')} desde a última cópia de segurança`,desc:'Se limpares os dados do browser, o cofre desaparece. Uma cópia recente evita perder tudo.',link:'Fazer cópia',act:'goto',attrs:'data-view="definicoes"'})}
</div></section>
<section class="rsec"><h2>Ligação ao computador</h2><div class="rgrid c3">
${rcard({num:'—',cls:'none',title:'Dispositivos ligados ao computador',desc:'Que dispositivos sincronizam com o cofre do computador, com o endereço IP, o endereço físico e a última ligação de cada um.',link:'Ver ligações',act:'goto',attrs:'data-view="logs" data-sub="ligacoes"',soon:'Versão local'})}
${rcard({num:'—',cls:'none',title:'Tentativas de ligação recusadas',desc:'Aparelhos da tua rede que tentaram ligar-se ao cofre com um código de emparelhamento errado.',link:'Ver ligações',act:'goto',attrs:'data-view="logs" data-sub="ligacoes"',soon:'Versão local'})}
${rcard({num:'—',cls:'none',title:'Última sincronização',desc:'Quando o computador e o telemóvel ficaram com o cofre igual pela última vez.',soon:'Versão local'})}
</div></section>`}
function viewReportsGeral(){const st=stats();const rows=st.rows.filter(r=>r.old||r.dup||r.weak||r.exposed).sort((a,b)=>(IMPW[b.imp]-IMPW[a.imp])||((2*b.exposed+b.weak+b.dup+b.old)-(2*a.exposed+a.weak+a.dup+a.old))||b.age-a.age).slice(0,8);
return `<section class="rsec"><div class="rgrid c4">

/* ---------- passwords expostas (Pwned Passwords, k-anonimato) ---------- */
async function sha1Hex(t){return [...new Uint8Array(await crypto.subtle.digest('SHA-1',enc.encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase()}
async function pwnRange(prefix){const url='https://api.pwnedpasswords.com/range/'+prefix;
  try{const r=await fetchT2(url,{headers:{'Add-Padding':'true'}});if(r.ok)return r.text()}catch(e){}
  const r=await fetchT2(url,{});if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}
function fetchT2(url,opts){const c=new AbortController();const t=setTimeout(()=>c.abort(),10000);return fetch(url,{...opts,cache:'no-store',referrerPolicy:'no-referrer',credentials:'omit',signal:c.signal}).finally(()=>clearTimeout(t))}
let pwnBusy=false;
async function pwnCheck(){if(pwnBusy)return;if(!S.data.settings.pwnedCheck){toast('Ativa primeiro a verificação nas Definições.','warn');return}
  const ents=S.data.entries.filter(e=>e.password);if(!ents.length){toast('Ainda não tens passwords para verificar.');return}
  pwnBusy=true;S.pwnCancel=false;
  openModal(`<h3>A verificar passwords</h3><p class="muted" id="pw-st">A preparar…</p><div class="meter"><span class="fill ok" id="pw-fill" style="width:0%"></span></div>
<p class="muted small">Só são enviados os primeiros 5 caracteres da impressão digital de cada password.</p><div class="modal-actions"><span class="grow"></span><button class="btn" data-act="pwnCancel">Cancelar</button></div>`);
  const map=new Map();for(const e of ents){const h=await sha1Hex(e.password);if(!map.has(h))map.set(h,[]);map.get(h).push(e)}
  const hashes=[...map.keys()];let done=0,exposed=0,failed=false;
  try{for(const h of hashes){if(S.pwnCancel)break;const txt=await pwnRange(h.slice(0,5));const suf=h.slice(5);let n=0;
      for(const line of txt.split('\n')){const k=line.indexOf(':');if(k>0&&line.slice(0,k).trim()===suf){n=parseInt(line.slice(k+1),10)||0;break}}
      for(const e of map.get(h))e.breach={n,at:Date.now()};if(n>0)exposed++;done++;
      const st=$('#pw-st');if(st)st.textContent=`Verificadas ${done} de ${hashes.length} passwords diferentes`;const f=$('#pw-fill');if(f)f.style.width=Math.round(100*done/hashes.length)+'%'}}
  catch(e){failed=true}
  pwnBusy=false;
  if(done){S.data.settings.pwnedLast=Date.now();logEv('seguranca',`Verificação de passwords expostas: ${done} ${pl(done,'verificada','verificadas')}, ${exposed} ${pl(exposed,'encontrada','encontradas')} em fugas`,exposed>0);save()}
  closeModal();
  if(failed&&!done){openModal(`<h3>Não foi possível verificar</h3><p class="muted">Não consegui contactar o serviço Pwned Passwords. Confirma que este computador tem ligação à internet e tenta de novo.</p>
<div class="modal-actions"><span class="grow"></span><button class="btn primary" data-act="closeModal">Fechar</button></div>`);return}
  if(S.view==='contas')renderList();else render();
  toast(failed||S.pwnCancel?`Verificação interrompida: ${done} de ${hashes.length} verificadas.`:exposed?`${exposed} ${pl(exposed,'password apareceu','passwords apareceram')} em fugas de dados. ${pl(exposed,'Muda-a','Muda-as')} quanto antes.`:'Nenhuma das tuas passwords aparece em fugas conhecidas.',exposed||failed?'warn':'')}

<div class="field"><label for="sg-code">${r?'Código de recuperação':'Código de 6 dígitos'}</label><input id="sg-code" class="totp-in" ${r?'maxlength="9" autocomplete="off" style="letter-spacing:.12em"':'inputmode="numeric" maxlength="6" autocomplete="one-time-code"'} data-in="sgAuto"></div>

async function sgSubmit(){if(sgBusy)return;const inp=$('#sg-code');if(!inp)return;const v=inp.value.trim();sgBusy=true;

function parseVal(s) {
  s = String(s || '').trim().replace(/\s|€/g, ''); if (!s) return NaN;

  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');

function calc() {
  const f = fin(); const acc = f.contas.map(a => ({ a, b: accBalance(a) }));
  const disp = acc.filter(x => ACC_TYPES[x.a.tipo] && ACC_TYPES[x.a.tipo].disp).reduce((s, x) => s + x.b, 0);
  const contas = acc.reduce((s, x) => s + x.b, 0);

}

    g += `<rect x="${(x0 + bw + 3).toFixed(1)}" y="${(y(0) - hd).toFixed(1)}" width="${bw.toFixed(1)}" height="${hd.toFixed(1)}" rx="4" fill="var(--exp)"><title>${e.n}: despesas ${eur(e.d)}</title></rect>`;

  movTipoF(a) { S.mtipo = a.dataset.v; renderMovs() },
  movSel() { S.msel = !S.msel; S.mselIds.clear(); render() },
  movBulkDel(a) { const ids = [...S.mselIds]; if (!ids.length) return; if (arm(a, `Confirmar: apagar ${ids.length}`)) return; fin().movs = fin().movs.filter(x => !ids.includes(x.id)); logEv('contas', `${ids.length} ${ids.length === 1 ? 'movimento apagado' : 'movimentos apagados'}`); S.msel = false; S.mselIds.clear(); save(); render(); toast(`${ids.length} ${ids.length === 1 ? 'movimento apagado' : 'movimentos apagados'}.`) },
  accAdd() { accModal(null) },
  accEdit(a) { accModal(a.closest('[data-id]').dataset.id) },
  accSave(a) { const id = a.dataset.id, nome = $('#ac-nome').value.trim(), tipo = $('#ac-tipo').value, ini = parseVal($('#ac-ini').value || '0');
    if (!nome) { setErr('Indica o nome da conta.', '#ac-err'); return } if (isNaN(ini)) { setErr('O saldo inicial não é um número válido.', '#ac-err'); return }
    if (id) { Object.assign(fin().contas.find(x => x.id === id), { nome, tipo, inicial: ini, updatedAt: Date.now() }); logEv('contas', `Conta editada: ${nome}`) }
    else { fin().contas.push({ id: uid(), nome, tipo, inicial: ini, createdAt: Date.now(), updatedAt: Date.now() }); logEv('contas', `Conta adicionada: ${nome}`) }
    save(); closeModal(); render(); toast('Conta guardada.') },
  accDel(a) { const id = a.dataset.id; const n = fin().movs.filter(m => m.conta === id).length;
    if (n) { setErr(`Esta conta tem ${n} ${n === 1 ? 'movimento' : 'movimentos'}. Muda-os para outra conta ou apaga-os primeiro.`, '#ac-err'); return }
    if (fin().contas.length === 1) { setErr('Precisas de pelo menos uma conta.', '#ac-err'); return }
    if (arm(a, 'Clica de novo para apagar')) return; const c = fin().contas.find(x => x.id === id); fin().contas = fin().contas.filter(x => x.id !== id); logEv('contas', `Conta apagada: ${c.nome}`); save(); closeModal(); render() },
  invAdd() { invModal(null) },
  invEdit(a) { invModal(a.closest('[data-id]').dataset.id) },
  invSave(a) { const id = a.dataset.id, nome = $('#iv-nome').value.trim(), tipo = $('#iv-tipo').value, inv = parseVal($('#iv-inv').value); let at = parseVal($('#iv-at').value); const data = $('#iv-data').value;
    if (!nome) { setErr('Indica o nome do investimento.', '#iv-err'); return } if (!(inv >= 0)) { setErr('Indica o valor investido.', '#iv-err'); return } if (isNaN(at)) at = inv; if (at < 0) { setErr('O valor atual não pode ser negativo.', '#iv-err'); return }
    if (id) { Object.assign(fin().invs.find(x => x.id === id), { nome, tipo, investido: inv, atual: at, data, updatedAt: Date.now() }); logEv('contas', `Investimento editado: ${nome}`) }
    else { fin().invs.push({ id: uid(), nome, tipo, investido: inv, atual: at, data, createdAt: Date.now(), updatedAt: Date.now() }); logEv('contas', `Investimento adicionado: ${nome}, ${eur(inv)}`) }
    save(); closeModal(); render(); toast('Investimento guardado.') },
  invDel(a) { if (arm(a, 'Clica de novo para apagar')) return; const i = fin().invs.find(x => x.id === a.dataset.id); fin().invs = fin().invs.filter(x => x.id !== a.dataset.id); logEv('contas', `Investimento apagado: ${i.nome}`); save(); closeModal(); render() },
  help() { openModal(`<h3>Ajuda</h3><p><b>Painel:</b> património líquido, saldo disponível, total investido, rendimentos, despesas e saldo do mês, taxa de poupança, resumo do ano, evolução mensal e gráfico. Escolhe o mês e o ano no topo.</p>
<p><b>Movimentos:</b> regista cada rendimento e despesa, com categoria e conta. Tudo o resto é calculado a partir daqui.</p><p><b>Contas:</b> as tuas contas, cartões e empréstimos, com o saldo atualizado.</p><p><b>Investimentos:</b> o que investiste e quanto vale hoje.</p>
<p><b>Segurança:</b> os dados ficam cifrados neste dispositivo. Entras com PIN e o código da app autenticadora, e as Definições pedem de novo o código.</p><div class="modal-actions"><span class="grow"></span><button class="btn primary" data-act="closeModal">Fechar</button></div>`) },
});
Object.assign(I, {
  fMonth(el) { S.fmonth = +el.value; render() },
  fYear(el) { S.fyear = +el.value; render() },
  movQ(el) { S.mq = el.value; renderMovs() },
  movMonth(el) { S.mmonth = el.value; renderMovs() },
  mvCat(el) { const n = $('#mv-catnova'); n.hidden = el.value !== '__nova'; if (!n.hidden) n.focus() },
  movSelOne(el) { if (el.checked) S.mselIds.add(el.dataset.id); else S.mselIds.delete(el.dataset.id); renderMovs() },
  movSelAll(el) { for (const id of S.mvis) { if (el.checked) S.mselIds.add(id); else S.mselIds.delete(id) } renderMovs() },
});

/* ---------- definições: tirar o que é só de passwords ---------- */
const dv_viewDef = viewDefinicoes;
viewDefinicoes = function () {
  let h = dv_viewDef();
  for (const title of ['Prazos de mudança de password', 'Verificação de passwords expostas', 'Importar do browser']) {
    const i = h.indexOf('<div class="set"><h3>' + title + '</h3>'); if (i < 0) continue;
    const j = h.indexOf('<div class="set">', i + 10); h = j < 0 ? h.slice(0, i) : h.slice(0, i) + h.slice(j);
  }
  return h.replace('adiciona algumas contas pouco importantes', 'regista alguns movimentos e contas pouco importantes');
};
const dv_render = render;
render = function () { dv_render(); if (S.screen === 'app' && S.view === 'movimentos') renderMovs() };

/* ---------- modo de teste (temporário): entra sem PIN nem código, num cofre de teste à parte ---------- */
const TEST_K = 'darkvest.v1.teste';
S.test = false;
function testBtn() { return '<div style="margin-top:18px;text-align:center"><button class="btn wide" data-act="testMode" style="border-style:dashed">Entrar em modo de teste (sem segurança)</button><p class="muted small" style="margin:8px 0 0">Temporário: abre um cofre de teste à parte, sem PIN nem código. Não dá acesso ao teu cofre verdadeiro.</p></div>' }
function addTest(h) { const i = h.indexOf('<div class="langpick">'); return i < 0 ? h.replace('</div></main>', testBtn() + '</div></main>') : h.slice(0, i) + testBtn() + h.slice(i) }
const dv_vw = viewWelcome; viewWelcome = function () { return addTest(dv_vw()) };
const dv_vu = viewUnlockPin; viewUnlockPin = function () { return addTest(dv_vu()) };
function removeSet(h, title) { const i = h.indexOf('<div class="set"><h3>' + title + '</h3>'); if (i < 0) return h; const j = h.indexOf('<div class="set">', i + 10); return j < 0 ? h.slice(0, i) + '</section>' : h.slice(0, i) + h.slice(j) }
A.testMode = function () {
  let d = null; try { d = JSON.parse(localStorage.getItem(TEST_K) || 'null') } catch (e) { }
  if (!d) d = { totp: { secret: '', lastStep: 0 }, recovery: [], entries: [], settings: {} };
  closeModal(); S.test = true; S.decoy = false; S.key = null; S.pending = null; S.pinBuf = ''; S.data = d; ensureDefaults();
  S.settingsOkUntil = Infinity; S.lastActivity = Date.now(); S.screen = 'app'; S.view = 'painel';
  logEv('acesso', 'Entrada em modo de teste (sem segurança)', true); save(); render();
  toast('Modo de teste: a segurança está desativada e os dados ficam num cofre de teste à parte.', 'warn');
};
A.testWipe = function (a) { if (!a.dataset.armed) { a.dataset.armed = '1'; a.textContent = 'Clica de novo para apagar'; return } try { localStorage.removeItem(TEST_K) } catch (e) { }
  S.data = { totp: { secret: '', lastStep: 0 }, recovery: [], entries: [], settings: {} }; ensureDefaults(); save(); render(); toast('Dados de teste apagados.') };
const dv_save2 = save; save = function () { if (S.test) { try { localStorage.setItem(TEST_K, JSON.stringify(S.data)) } catch (e) { } return Promise.resolve() } return dv_save2() };
const dv_tick = tickTimer; tickTimer = function () { if (S.test) { const el = $('#lockTimer'); if (el) el.textContent = ''; return } return dv_tick() };
const dv_lock2 = lock; lock = function (r) { if (S.test) { S.test = false; S.settingsOkUntil = 0; S.data = null; S.msel = false; closeModal(); S.screen = readBlob() ? 'unlock-pin' : 'welcome'; render(); return } return dv_lock2(r) };
const dv_vd2 = viewDefinicoes; viewDefinicoes = function () { let h = dv_vd2(); if (!S.test) return h;
  for (const t of ['PIN de coação', 'Autodestruição', 'Bloqueio automático', 'PIN', 'App autenticadora', 'Códigos de recuperação', 'Cópia de segurança', 'Apagar cofre']) h = removeSet(h, t);
  return h.replace('<section class="settings">', '<section class="settings"><div class="set"><h3>Modo de teste</h3><p>Estás num cofre de teste, sem PIN, sem app autenticadora e sem cifra. As opções de segurança ficam escondidas aqui e voltam quando entrares no teu cofre verdadeiro. Para sair, usa «Bloquear cofre».</p><button class="btn danger" data-act="testWipe">Apagar dados de teste</button></div>') };
const dv_render2 = render; render = function () { dv_render2(); if (S.test && S.screen === 'app') { const tb = $('.topbar'); if (tb && !$('#dv-testtag')) { const s = document.createElement('span'); s.id = 'dv-testtag'; s.className = 'tag warn'; s.textContent = 'Modo de teste'; tb.insertBefore(s, tb.firstChild) } } };

if (S.screen === 'welcome' || S.screen === 'unlock-pin') render();

</script>
